openapi: 3.0.3
info:
  title: Physical AI & Humanoid Robotics Textbook Platform API
  description: API for the textbook platform with authentication, RAG chatbot, personalization, and translation features
  version: 1.0.0
servers:
  - url: https://api.textbook-platform.example.com
    description: Production server
  - url: http://localhost:8000
    description: Development server

paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account with provided credentials and background information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password
                name:
                  type: string
                  description: User's full name
                background_software:
                  type: string
                  description: User's software experience level
                background_hardware:
                  type: string
                  description: User's hardware experience level
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique user identifier
                  email:
                    type: string
                    format: email
                    description: User's email
                  name:
                    type: string
                    description: User's name
                  created_at:
                    type: string
                    format: date-time
                    description: Account creation timestamp
        '400':
          description: Invalid input data
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: User login
      description: Authenticates user with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '400':
          description: Invalid input data

  /auth/me:
    get:
      summary: Get current user
      description: Returns information about the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /content:
    get:
      summary: List textbook content
      description: Returns a list of available textbook chapters and sections
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
        - name: level
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced]
          description: Filter by content difficulty level
      responses:
        '200':
          description: List of textbook content
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TextbookContent'
                  total:
                    type: integer
                    description: Total number of items available
        '400':
          description: Invalid parameters

  /content/{slug}:
    get:
      summary: Get specific content
      description: Returns a specific textbook chapter or section by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: URL-friendly identifier for the content
      responses:
        '200':
          description: Textbook content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextbookContent'
        '404':
          description: Content not found

  /content/{slug}/personalize:
    get:
      summary: Get personalized content
      description: Returns textbook content adapted based on user's background and preferences
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: URL-friendly identifier for the content
      responses:
        '200':
          description: Personalized textbook content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextbookContent'
        '401':
          description: Unauthorized
        '404':
          description: Content not found

  /content/{slug}/translate/ur:
    get:
      summary: Get Urdu translation
      description: Returns the Urdu translation of textbook content
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: URL-friendly identifier for the content
      responses:
        '200':
          description: Urdu translation of textbook content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextbookContent'
        '401':
          description: Unauthorized
        '404':
          description: Content or translation not found

  /rag/chat:
    post:
      summary: Chat with RAG system
      description: Send a question to the RAG chatbot and receive a context-aware response
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - content_slug
              properties:
                message:
                  type: string
                  description: User's question
                content_slug:
                  type: string
                  description: Slug of content context for the question
                history:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatMessage'
                  description: Previous conversation history (optional)
      responses:
        '200':
          description: RAG chat response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: Chatbot's response
                  sources:
                    type: array
                    items:
                      type: string
                    description: Source content used for response
                  confidence:
                    type: number
                    description: Confidence score of the response
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /preferences/theme:
    get:
      summary: Get user theme preference
      description: Returns the current theme preference for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's theme preference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemePreference'
        '401':
          description: Unauthorized
    put:
      summary: Update user theme preference
      description: Updates the theme preference for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - theme_mode
              properties:
                theme_mode:
                  type: string
                  enum: [light, dark, system]
                  description: Selected theme mode
      responses:
        '200':
          description: Theme preference updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemePreference'
        '400':
          description: Invalid theme mode
        '401':
          description: Unauthorized

  /preferences/personalization:
    get:
      summary: Get personalization profile
      description: Returns the current personalization profile for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User's personalization profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationProfile'
        '401':
          description: Unauthorized
    put:
      summary: Update personalization profile
      description: Updates the personalization profile for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalizationProfileUpdate'
      responses:
        '200':
          description: Personalization profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalizationProfile'
        '400':
          description: Invalid personalization data
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the user
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's full name
        role:
          type: string
          enum: [student, educator, admin]
          description: User's role
        background_software:
          type: string
          description: User's software experience level
        background_hardware:
          type: string
          description: User's hardware experience level
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        last_login:
          type: string
          format: date-time
          description: Last login timestamp

    TextbookContent:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the content
        title:
          type: string
          description: Title of the chapter/section
        slug:
          type: string
          description: URL-friendly identifier
        content:
          type: string
          description: Main content in markdown format
        content_ur:
          type: string
          description: Urdu translation of content (if available)
        chapter_number:
          type: integer
          description: Chapter sequence number
        section_number:
          type: integer
          description: Section sequence number within chapter
        level:
          type: string
          enum: [beginner, intermediate, advanced]
          description: Content difficulty level
        prerequisites:
          type: array
          items:
            type: string
          description: List of prerequisite content IDs
        learning_objectives:
          type: array
          items:
            type: string
          description: List of learning objectives
        created_at:
          type: string
          format: date-time
          description: Content creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
        is_published:
          type: boolean
          description: Content publication status

    ThemePreference:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the preference
        user_id:
          type: string
          description: Reference to User
        theme_mode:
          type: string
          enum: [light, dark, system]
          description: Selected theme mode
        created_at:
          type: string
          format: date-time
          description: Preference creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    PersonalizationProfile:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the profile
        user_id:
          type: string
          description: Reference to User
        content_level_preference:
          type: string
          enum: [beginner, intermediate, advanced]
          description: Preferred content difficulty
        example_preference:
          type: string
          enum: [theoretical, practical]
          description: Preferred example types
        detail_preference:
          type: string
          enum: [concise, detailed]
          description: Detail level preference
        learning_path:
          type: array
          items:
            type: string
          description: Customized learning path
        created_at:
          type: string
          format: date-time
          description: Profile creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    PersonalizationProfileUpdate:
      type: object
      properties:
        content_level_preference:
          type: string
          enum: [beginner, intermediate, advanced]
          description: Preferred content difficulty
        example_preference:
          type: string
          enum: [theoretical, practical]
          description: Preferred example types
        detail_preference:
          type: string
          enum: [concise, detailed]
          description: Detail level preference
        learning_path:
          type: array
          items:
            type: string
          description: Customized learning path

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: Role of the message sender
        content:
          type: string
          description: Message content
        timestamp:
          type: string
          format: date-time
          description: Message timestamp